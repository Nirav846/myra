version: '3.8'

services:
  myra:
    build: .
    container_name: myra
    ports:
      - "8000:8000"  # FastAPI backend
    volumes:
      - ./myra_app/db:/app/myra_app/db  # Database persistence
      - ./data:/app/data                # Raw data
      - ./models:/app/models            # ML models
      - ./logs:/app/logs                # Application logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
