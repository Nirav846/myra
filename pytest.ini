[pytest]
# Bare `pytest` from the repo root would otherwise walk the whole tree and
# collect the gitignored eod2*, eod2-old* archive directories (and stray
# test_*.py files in myra_web/), which fail at collection — 40 errors before
# a single test ran. Pin collection to the real suite.
testpaths = tests

# -ra: print the extra "short test summary" lines (skips, xfails, errors) so a
#      test that silently stops running is visible instead of looking like a
#      pass.
# --strict-markers: fail on a typo'd @pytest.mark.<name> instead of warning.
addopts = -ra --strict-markers

# Custom markers (registered here so --strict-markers passes).
markers =
    slow: long-running tests (e.g. live technical.db multi-scanner parity); deselect with -m "not slow"
