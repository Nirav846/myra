name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly audit — Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Cancel a superseded run for the same ref (rapid pushes / PR updates) so we
# neither pay for stale runs nor wait behind them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Build fixture DBs before pytest. conftest.py skips any test requesting
      # fixture_db_dir when a fixture file is absent, so without this step all
      # fixture-based tests (incl. test_schema_contract.py) skip silently.
      - name: Build fixture DBs
        run: python tests/fixtures/build_fixture_db.py

      # Same command documented for local use (see CONTRIBUTING.md). -rs prints
      # skip reasons, --durations surfaces the slowest tests, and the coverage
      # report (informational — no threshold is enforced) flags untested paths.
      - name: Run tests
        run: pytest tests/ -rs --durations=15 --cov=myra_app --cov-report=term-missing:skip-covered
        env:
          PYTHONPATH: ${{ github.workspace }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Scoped to tests/: the rest of the tree carries legacy formatting that
      # pre-commit fixes per-file. tests/ is kept clean as a hard gate, which
      # matters because a `--no-verify` push bypasses the local hooks.
      - name: black (tests/)
        run: black --check tests/

      - name: flake8 (tests/)
        run: flake8 tests/

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myra_web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Verify build output
        run: ls -la dist/

  # ──────────────────────────────────────────────────────────────
  # Weekly dependency audit (catches gaps in Dependabot's cadence)
  # ──────────────────────────────────────────────────────────────
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --require-hashes=false --progress-spinner=off
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Run pnpm audit
        working-directory: myra_web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate
        continue-on-error: false

# ──────────────────────────────────────────────────────────────
# External deployment platforms (Vercel / Netlify / Cloudflare)
# ──────────────────────────────────────────────────────────────
# If deploying the frontend externally, set the root / base
# directory to  myra_web  so that Vite can resolve index.html:
#
#   Vercel  →  Project Settings > General > Root Directory: myra_web
#              Build Command:      npm run build
#              Output Directory:   dist
#
#   Netlify →  Site Settings > Build & deploy > Build settings
#              Base directory:     myra_web
#              Build command:      npm run build
#              Publish directory:  dist
#
#   Cloudflare Pages →  Build configuration
#              Root directory:      myra_web
#              Build command:       npm run build
#              Build output dir:    dist
